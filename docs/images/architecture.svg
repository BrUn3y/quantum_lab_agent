<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Quantum Lab Agent multi-agent architecture</title>
  <desc id="desc">BeeAI powered Quantum Lab Agent orchestrates Developer, Status, Computing, and Experiment agents over A2A. Qiskit connects status and computing services to IBM Quantum Platform, while Experiment delegates real execution to Computing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ff"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/><stop offset="1" stop-color="#31135e"/>
    </linearGradient>
    <linearGradient id="ibm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#001d6c"/><stop offset="1" stop-color="#0f62fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#161616" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6929c4"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0f62fe"/>
    </marker>
    <symbol id="bee" viewBox="0 0 64 64">
      <path d="M29 8c8 0 14 6 14 14 0 7-6 13-14 13H10C10 20 18 8 29 8Z" fill="currentColor"/>
      <path d="M35 56c-8 0-14-6-14-14 0-7 6-13 14-13h19c0 15-8 27-19 27Z" fill="currentColor"/>
      <circle cx="51" cy="12" r="6" fill="currentColor"/><circle cx="58" cy="22" r="4" fill="currentColor"/>
      <path d="M15 48 50 13" stroke="white" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="qiskit" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <ellipse cx="32" cy="18" rx="23" ry="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <ellipse cx="32" cy="32" rx="27" ry="8" fill="none" stroke="currentColor" stroke-width="2"/>
      <ellipse cx="32" cy="46" rx="22" ry="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M19 8c4 12 11 23 19 34 5 7 10 11 15 13" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="42" cy="47" r="3.5" fill="#fff" stroke="currentColor" stroke-width="2"/>
    </symbol>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{fill:#525252}.label{font-size:19px;font-weight:700;letter-spacing:1.4px}.card-title{font-size:27px;font-weight:700;fill:#161616}.card-copy{font-size:17px;fill:#525252}.pill{font-size:14px;font-weight:700;letter-spacing:.7px}.port{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#6f6f6f}
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1465" cy="85" r="210" fill="#d9e8ff" opacity=".45"/><circle cx="90" cy="820" r="230" fill="#e8daff" opacity=".35"/>

  <text x="80" y="70" class="label" fill="#6929c4">MULTI-AGENT QUANTUM WORKSPACE</text>
  <text x="80" y="112" font-size="19" class="muted">Coordinated generation, monitoring, optimization and real QPU execution</text>
  <g transform="translate(1295 57)" color="#161616">
    <use href="#bee" width="48" height="48"/>
    <text x="58" y="22" font-size="23" font-weight="750">BeeAI</text><text x="58" y="44" font-size="14" class="muted">Framework</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="150" width="820" height="150" rx="28" fill="url(#hero)"/>
    <rect x="416" y="176" width="66" height="66" rx="18" fill="#fff" opacity=".12"/>
    <g transform="translate(425 185)" color="#fff"><use href="#bee" width="48" height="48"/></g>
    <text x="510" y="213" font-size="36" font-weight="760" fill="#fff">Quantum Lab Agent</text>
    <text x="510" y="250" font-size="20" fill="#d4bbff">Main orchestrator · intelligent routing · unified response</text>
    <rect x="1005" y="194" width="150" height="38" rx="19" fill="#fff" opacity=".12"/>
    <text x="1080" y="219" text-anchor="middle" class="port" fill="#fff">localhost:8000</text>
  </g>

  <path d="M800 300V344M245 344H1355M245 344V388M615 344V388M985 344V388M1355 344V388" fill="none" stroke="#6929c4" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="754" y="322" width="92" height="38" rx="19" fill="#f2e8ff"/><text x="800" y="347" text-anchor="middle" class="pill" fill="#6929c4">A2A</text>

  <g filter="url(#shadow)">
    <g transform="translate(80 388)">
      <rect width="330" height="220" rx="24" fill="#fff" stroke="#e0e0e0"/>
      <rect width="7" height="220" rx="4" fill="#8a3ffc"/>
      <circle cx="52" cy="54" r="28" fill="#f2e8ff"/><text x="52" y="63" text-anchor="middle" font-size="27">&lt;/&gt;</text>
      <text x="92" y="51" class="card-title">Developer</text><text x="92" y="78" class="port">:8001</text>
      <text x="28" y="125" class="card-copy">Generates QASM, Qiskit code</text><text x="28" y="151" class="card-copy">and quantum algorithms.</text>
      <rect x="28" y="174" width="116" height="28" rx="14" fill="#f2e8ff"/><text x="86" y="193" text-anchor="middle" class="pill" fill="#6929c4">GENERATION</text>
    </g>
    <g transform="translate(450 388)">
      <rect width="330" height="220" rx="24" fill="#fff" stroke="#e0e0e0"/>
      <rect width="7" height="220" rx="4" fill="#0f62fe"/>
      <circle cx="52" cy="54" r="28" fill="#edf5ff"/><g transform="translate(34 36)" color="#6929c4"><use href="#qiskit" width="36" height="36"/></g>
      <text x="92" y="51" class="card-title">Status</text><text x="92" y="78" class="port">:8002</text>
      <text x="28" y="125" class="card-copy">Monitors live backends, queues,</text><text x="28" y="151" class="card-copy">topology and quantum jobs.</text>
      <rect x="28" y="174" width="116" height="28" rx="14" fill="#edf5ff"/><text x="86" y="193" text-anchor="middle" class="pill" fill="#0f62fe">MONITORING</text>
    </g>
    <g transform="translate(820 388)">
      <rect width="330" height="220" rx="24" fill="#fff" stroke="#e0e0e0"/>
      <rect width="7" height="220" rx="4" fill="#0f62fe"/>
      <circle cx="52" cy="54" r="28" fill="#edf5ff"/><g transform="translate(34 36)" color="#6929c4"><use href="#qiskit" width="36" height="36"/></g>
      <text x="92" y="51" class="card-title">Computing</text><text x="92" y="78" class="port">:8003</text>
      <text x="28" y="125" class="card-copy">Executes fresh simulator and</text><text x="28" y="151" class="card-copy">real IBM Quantum jobs.</text>
      <rect x="28" y="174" width="104" height="28" rx="14" fill="#edf5ff"/><text x="80" y="193" text-anchor="middle" class="pill" fill="#0f62fe">EXECUTION</text>
    </g>
    <g transform="translate(1190 388)">
      <rect width="330" height="220" rx="24" fill="#fff" stroke="#d4bbff" stroke-width="2" stroke-dasharray="8 6"/>
      <rect width="7" height="220" rx="4" fill="#6929c4"/>
      <circle cx="52" cy="54" r="28" fill="#f2e8ff"/><text x="52" y="63" text-anchor="middle" font-size="27">⚗</text>
      <text x="92" y="51" class="card-title">Experiment</text><text x="92" y="78" class="port">:8004</text>
      <text x="28" y="125" class="card-copy">Builds hybrid QAOA/VQE studies</text><text x="28" y="151" class="card-copy">and delegates QPU execution.</text>
      <rect x="28" y="174" width="136" height="28" rx="14" fill="#f2e8ff"/><text x="96" y="193" text-anchor="middle" class="pill" fill="#6929c4">DEVELOPMENT</text>
    </g>
  </g>

  <path d="M1355 608V650H985V608" fill="none" stroke="#6929c4" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="1090" y="628" width="160" height="34" rx="17" fill="#f2e8ff"/><text x="1170" y="651" text-anchor="middle" class="pill" fill="#6929c4">REAL EXECUTION</text>

  <path d="M615 608V700M985 608V700" fill="none" stroke="#0f62fe" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="565" y="645" width="100" height="34" rx="17" fill="#edf5ff"/><text x="615" y="668" text-anchor="middle" class="pill" fill="#0f62fe">QISKIT</text>
  <rect x="935" y="645" width="100" height="34" rx="17" fill="#edf5ff"/><text x="985" y="668" text-anchor="middle" class="pill" fill="#0f62fe">QISKIT</text>

  <g filter="url(#shadow)">
    <rect x="380" y="700" width="840" height="130" rx="26" fill="url(#ibm)"/>
    <g transform="translate(425 731)">
      <text x="0" y="45" font-size="58" font-weight="900" letter-spacing="-4" fill="#fff">IBM</text>
      <g stroke="#0f62fe" stroke-width="4"><path d="M0 12h100M0 22h100M0 32h100M0 42h100"/></g>
    </g>
    <text x="570" y="770" font-size="34" font-weight="700" fill="#fff">Quantum Platform</text>
    <text x="570" y="799" font-size="17" fill="#d0e2ff">Live backends · QPU topology · queues · job results</text>
    <rect x="1032" y="744" width="140" height="40" rx="20" fill="#fff" opacity=".14"/>
    <text x="1102" y="770" text-anchor="middle" class="pill" fill="#fff">REAL QPUs</text>
  </g>
  <text x="800" y="872" text-anchor="middle" font-size="15" fill="#6f6f6f">BeeAI Framework · A2A protocol · Qiskit · IBM Quantum Platform</text>
</svg>
