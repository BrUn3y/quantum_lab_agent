[project]
name = "beeai-agents"
version = "0.1.1"
description = "BeeAI Agents with X Trends and Quantum Computing capabilities"
readme = "README.md"
authors = [{ name = "IBM Corp." }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "agentstack-sdk==0.4.0rc1",
    "beeai_framework>=0.1.76",
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.20.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[project.scripts]
server = "beeai_agents.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
